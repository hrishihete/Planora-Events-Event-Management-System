services:
  postgres:
    image: postgres:16-alpine
    container_name: planora-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-planora}
      POSTGRES_USER: ${POSTGRES_USER:-planora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planora}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - planora_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planora} -d ${POSTGRES_DB:-planora}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  planora_pg_data:
